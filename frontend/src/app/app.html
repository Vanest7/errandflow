<app-header />

<ng-container *transloco="let t">
  @if (auth.isLoading() || auth.isSynchronizing()) {
    <main class="flex min-h-[calc(100dvh-5rem)] items-center justify-center p-6" aria-live="polite">
      <p class="text-[var(--ef-text-muted)]">{{ t('auth.loading') }}</p>
    </main>
  } @else if (auth.isAuthenticated() && (auth.error() || !auth.registeredUser())) {
    <main class="mx-auto flex min-h-[calc(100dvh-5rem)] max-w-lg flex-col items-center justify-center gap-4 px-6 text-center">
      <h1 class="text-2xl font-bold">{{ t('auth.profileErrorTitle') }}</h1>
      <p class="text-[var(--ef-text-muted)]" role="alert">{{ t('auth.profileErrorDescription') }}</p>
      <button
        type="button"
        class="min-h-11 rounded-xl bg-[var(--ef-primary)] px-6 py-3 font-semibold text-[var(--ef-on-primary)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--ef-primary)]"
        (click)="auth.retryProfileSynchronization()"
      >
        {{ t('common.retry') }}
      </button>
    </main>
  } @else {
    <router-outlet />
  }
</ng-container>
