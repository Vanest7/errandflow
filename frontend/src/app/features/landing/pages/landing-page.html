<section
  *transloco="let t"
  class="relative overflow-hidden"
>
  <div
    class="mx-auto grid min-h-[calc(100dvh-5rem)] max-w-7xl items-center gap-10 px-6 py-12 sm:px-8 md:py-16 lg:grid-cols-2 lg:gap-16"
  >
    <!-- Hero content -->
    <div class="max-w-xl">
      <h1
        class="text-4xl font-bold leading-tight tracking-tight sm:text-5xl xl:text-6xl"
      >
        {{ t('landing.title') }}

        <span class="text-[var(--ef-primary)]">
          {{ t('landing.titleAccent') }}
        </span>
      </h1>

      <p
        class="mt-6 max-w-lg text-base leading-relaxed text-[var(--ef-text-muted)] sm:text-lg"
      >
        {{ t('landing.description') }}
      </p>
      <!-- Key benefits -->
      <div class="mt-8 grid grid-cols-1 gap-5 sm:grid-cols-3 sm:gap-4">
        <!-- Organize errands -->
        <div class="flex items-center gap-3">
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[var(--ef-surface-raised)] text-[var(--ef-primary)]"
          >
      <span class="material-symbols-outlined text-2xl" aria-hidden="true">
        checklist
      </span>
          </div>

          <span class="text-sm font-medium leading-snug">
      {{ t('landing.benefits.organize') }}
    </span>
        </div>

        <!-- Optimize routes -->
        <div class="flex items-center gap-3">
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[var(--ef-surface-raised)] text-[var(--ef-primary)]"
          >
      <span class="material-symbols-outlined text-2xl" aria-hidden="true">
        route
      </span>
          </div>

          <span class="text-sm font-medium leading-snug">
      {{ t('landing.benefits.routes') }}
    </span>
        </div>

        <!-- Save time -->
        <div class="flex items-center gap-3">
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[var(--ef-surface-raised)] text-[var(--ef-primary)]"
          >
      <span class="material-symbols-outlined text-2xl" aria-hidden="true">
        schedule
      </span>
          </div>

          <span class="text-sm font-medium leading-snug">
      {{ t('landing.benefits.time') }}
    </span>
        </div>
      </div>
      <button
        type="button"
        class="mt-8 inline-flex min-h-12 items-center justify-center rounded-xl bg-[var(--ef-primary)] px-8 py-3 font-semibold text-[var(--ef-on-primary)] transition-opacity hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[var(--ef-primary)]"
        (click)="auth.login()"
      >
        {{ t('landing.cta') }}

      </button>
    </div>

    <!-- Route illustration -->
    <div class="w-full">
      <img
        [src]="theme.isDark()
      ? '/images/errandflow-route-hero.webp'
      : '/images/Errandflow-light.webp'"
        [alt]="t('landing.mapAlt')"
        width="790"
        height="620"
        loading="eager"
        decoding="async"
        class="h-auto w-full rounded-2xl object-contain"
      />
    </div>
  </div>
</section>
